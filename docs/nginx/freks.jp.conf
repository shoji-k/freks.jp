server {
    server_name freks.jp;
    root /usr/share/nginx/freks.jp/;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl;

    access_log /var/log/nginx/freks.jp.access.log;
    error_log /var/log/nginx/freks.jp.error.log warn;

    ssl_certificate /etc/letsencrypt/live/freks.jp/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/freks.jp/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = freks.jp) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name freks.jp;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}